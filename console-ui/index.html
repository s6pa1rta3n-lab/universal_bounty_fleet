<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fleet Console — Universal Bounty Fleet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="universe" aria-hidden="true"></canvas>
    <div class="wrap">
      <header class="nav">
        <div class="brand">
          <div class="mark">UB</div>
          <span>Universal Bounty Fleet</span>
        </div>
        <div class="nav-meta">
          <span class="live"><i id="health-dot" class="dot bad"></i><span id="health-label">offline</span></span>
          <span id="clock">00:00:00Z</span>
        </div>
      </header>

      <section class="hero">
        <p class="kicker">Fortified Enterprise Fleet</p>
        <h1 id="banner" class="status PENDING">PENDING</h1>
        <p id="banner-sub" class="lede">Waiting for fleet state.</p>
      </section>

      <main class="cards">
        <section class="card">
          <h2>Bounty</h2>
          <div id="bounty" class="empty">No live bounty yet.</div>
        </section>
        <section class="card">
          <h2>Trace</h2>
          <div id="timeline" class="empty">Intake, Executor, and Auditor write here.</div>
        </section>
        <section class="card">
          <h2>Registry</h2>
          <div id="registry"></div>
        </section>
      </main>

      <footer id="gcp"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
