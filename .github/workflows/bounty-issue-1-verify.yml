name: Bounty Issue #1 Verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "contracts/**"
      - "console-ui/**"
      - "scripts/dry_run_issue_1.py"
      - "Makefile"
      - "requirements.txt"
      - "submissions/issue-1/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      USE_IN_MEMORY_FIRESTORE: "true"
      GITHUB_WEBHOOK_SECRET: test-webhook-secret-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run acceptance verify
        run: make verify
